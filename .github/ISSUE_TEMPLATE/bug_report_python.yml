name: Bug Report - Python
description: File a bug report for the Python version of the AntiSSRF library
title: "[Bug][Python]: <title>"
labels: ["bug", "python"]
type: bug
body:

  - type: textarea
    attributes:
      label: Bug Behavior
      description: Describe the current behavior you are experiencing. Include any error messages, unexpected responses, or other issues.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Expected Behavior
      description: Describe what you expected to happen instead of the current behavior.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Steps To Reproduce
      description: Provide clear steps to reproduce this issue, including code samples if applicable.
      placeholder: |
        1. Import the library: `from AntiSSRF import AntiSSRFPolicy, PolicyConfigOptions`
        2. Create policy: `policy = AntiSSRFPolicy(PolicyConfigOptions.EXTERNAL_ONLY_LATEST)`
        3. Get session: `session = policy.get_antissrf_session()`
        4. Make request: `response = session.get("https://example.com")`
        5. Observe unexpected behavior: [describe what happens]
    validations:
      required: false

  - type: input
    attributes:
      label: Version
      description: Specify the version of the AntiSSRF Python library where you encountered this issue.
      placeholder: "e.g., 1.0.0"
    validations:
      required: true

  - type: input
    attributes:
      label: Operating System
      description: Specify your operating system and version.
      placeholder: "e.g., Ubuntu 22.04, Windows 11, macOS 15.0"
    validations:
      required: true

  - type: input
    attributes:
      label: Python Version
      description: Specify the Python version you are using.
      placeholder: "e.g., 3.13.0"
    validations:
      required: true

  - type: textarea
    attributes:
      label: Additional Context
      description: |
        Provide any additional context, links to documentation, stack traces, or other relevant information that may help us understand and resolve this issue.
    validations:
      required: false

  - type: checkboxes
    attributes:
      label: Verification
      description: Please confirm before submitting your bug report.
      options:
        - label: I have searched existing issues and confirmed this bug has not already been reported
          required: true
    
  - type: markdown
    attributes:
      value: "Thank you for helping us improve the AntiSSRF library!"
