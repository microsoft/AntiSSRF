[package]
name = "antissrf"
version = "0.1.1"
edition = "2024"
authors = ["whiteberets.eth <finn79426@gmail.com>"]
description = "Rust implementation of Microsoft AntiSSRF"
license = "MIT"
repository = "https://github.com/microsoft/AntiSSRF"

[dependencies]
thiserror = "2.0.18"
ipnetwork = "0.21.1"
url = "2.5.8"
reqwest = { version = "0.13.4", optional = true }
reqwest-middleware = { version = "0.5.2", optional = true }
async-trait = { version = "0.1.89", optional = true }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"], optional = true }
http = { version = "1.4.1", optional = true }

[dev-dependencies]
mockito = "1.7.2"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }

[features]
default = ["reqwest-integration"]
reqwest-integration = ["dep:reqwest", "dep:reqwest-middleware", "dep:async-trait", "dep:tokio", "dep:http"]
