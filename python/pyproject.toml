[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "microsoft-antissrf"
description = "Microsoft AntiSSRF Python Library"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Microsoft" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "urllib3>=2.7.0",
    "idna>=3.7",
    "requests>=2.34.2",
]
# Version is injected at build time via the PACKAGE_VERSION env var (see setup.py).
dynamic = ["version"]

[project.optional-dependencies]
dev = ["build", "pytest"]

[project.urls]
Homepage = "https://microsoft.github.io/AntiSSRF/"
Repository = "https://github.com/Microsoft/AntiSSRF"
Issues = "https://github.com/Microsoft/AntiSSRF/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]